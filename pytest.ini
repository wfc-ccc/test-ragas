[pytest]
# 高升AI接口自动化 pytest 配置
testpaths =
    gs_api/script
    tests

python_files =
    test_*.py
    *_test.py

python_classes =
    Test*

python_functions =
    test_*

addopts =
    -v
    --strict-markers
    --alluredir=gs_api/report/output/allure_results
    --tb=short
    -p no:warnings

markers =
    session: 会话接口用例
    chat: 聊天接口用例
    history: 历史会话接口用例
    embedding: 知识库向量接口用例
    audio: 语音接口用例
    ragas: AI回答质量评估用例
    webui: Web UI 冒烟测试用例
    smoke: 冒烟测试
    slow: 耗时较长的测试
    requires_llm: 需要评估LLM密钥
